[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
cache = true
solc_version = "0.8.26"
gas_reports = ["*"]
remappings = [
    "@openzeppelin/openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "@openzeppelin/openzeppelin-contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/"
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
ignore = ["lib/**"]

[lint]
severity = ["high"]
# Both rules are intentional here:
# - arbitrary-send-eth: Trade forwards msg.value to the collection the caller picked.
# - encode-packed-collision: the CREATE2 salt/address derivation uses fixed-size
#   types plus the canonical creationCode + init code hash.
exclude_lints = ["arbitrary-send-eth", "encode-packed-collision"]
