name: Feature request
description: Suggest an improvement to the contracts, tests, tooling or docs
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Describe the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Alternative designs are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - contracts (core)
        - periphery
        - pricing curves
        - tests
        - deployment / tooling
        - documentation
    validations:
      required: true
  - type: checkboxes
    id: breaking
    attributes:
      label: Impact
      options:
        - label: This would change the ABI or storage layout of a deployed contract
