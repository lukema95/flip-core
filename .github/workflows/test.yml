name: contracts

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout dependencies
        run: git submodule update --init lib/forge-std lib/openzeppelin-contracts lib/openzeppelin-contracts-upgradeable

      - name: Check license headers
        run: bash scripts/check-licenses.sh

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Cache solc
        uses: actions/cache@v4
        with:
          path: ~/.svm
          key: svm-${{ runner.os }}-${{ hashFiles('foundry.toml') }}
          restore-keys: |
            svm-${{ runner.os }}-

      - name: Check formatting
        run: forge fmt --check

      - name: Build with sizes
        run: |
          forge --version
          forge build --sizes

      - name: Lint Solidity
        run: forge lint

      - name: Run tests
        run: forge test -vvv

  node:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout dependencies
        run: git submodule update --init lib/forge-std lib/openzeppelin-contracts lib/openzeppelin-contracts-upgradeable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Solidity
        run: pnpm lint

      - name: Check TypeScript formatting
        run: pnpm format:ts:check

      - name: Typecheck scripts and config
        run: pnpm typecheck

      - name: Cache the Hardhat compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/hardhat-nodejs
          key: hardhat-solc-${{ hashFiles('hardhat.config.ts') }}

      - name: Compile with Hardhat
        run: npx hardhat compile

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout dependencies
        run: git submodule update --init lib/forge-std lib/openzeppelin-contracts lib/openzeppelin-contracts-upgradeable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Cache solc
        uses: actions/cache@v4
        with:
          path: ~/.svm
          key: svm-${{ runner.os }}-${{ hashFiles('foundry.toml') }}
          restore-keys: |
            svm-${{ runner.os }}-

      - name: Check coverage threshold
        run: bash scripts/check-coverage.sh

  slither:
    name: Static analysis (slither)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout dependencies
        run: git submodule update --init lib/forge-std lib/openzeppelin-contracts lib/openzeppelin-contracts-upgradeable

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Cache solc
        uses: actions/cache@v4
        with:
          path: ~/.svm
          key: svm-${{ runner.os }}-${{ hashFiles('foundry.toml') }}
          restore-keys: |
            svm-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install slither
        run: pip install slither-analyzer

      - name: Run slither
        run: slither . --config-file slither.config.json --fail-medium
